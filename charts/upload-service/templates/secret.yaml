apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-upload-service-secret
  labels:
    app.kubernetes.io/name: upload-service
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  UPLOAD_DB_DSN: {{ .Values.secret.dbDSN | quote }}
  UPLOAD_AMQP_URL: {{ .Values.secret.amqpURL | quote }}
  UPLOAD_JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secret.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secret.minioSecretKey | quote }}
